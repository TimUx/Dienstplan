name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-and-quality:
    name: Tests and code quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q api constraints tests *.py

      - name: Run test suite and coverage
        run: |
          python -m pytest -m "not slow" tests/ --tb=short -q \
            --cov=api --cov=constraints --cov=solver --cov=model --cov=validation \
            --cov=data_loader --cov=db_init --cov-report=term-missing

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag dienstplan:pr-${{ github.event.pull_request.number }} .
